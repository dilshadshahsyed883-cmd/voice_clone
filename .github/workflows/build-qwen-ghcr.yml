name: qwen-build-ghcr

on:
  push:
    branches:
      - engine/qwen3-tts-0.6b
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

concurrency:
  group: qwen-ghcr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk for GPU torch and embedded model
        run: |
          df -h
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache || true
          docker system prune -af || true
          df -h
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=qwen3-tts-0.6b-candidate
            type=sha,prefix=qwen3-tts-0.6b-
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
      - name: Save immutable image digest evidence
        run: |
          mkdir -p artifacts
          printf '%s\n' '${{ steps.build.outputs.digest }}' > artifacts/image-digest.txt
          printf '%s\n' '${{ github.sha }}' > artifacts/source-commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: qwen-ghcr-build-evidence
          path: artifacts/
