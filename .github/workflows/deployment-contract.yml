name: Shared Salad image contract (no deployment)
on:
  push:
    branches: ['main']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Enforce stable web-control/container slots and branch image
        run: python3 scripts/resolve_salad_image.py --validate --branch "$GITHUB_REF_NAME"
